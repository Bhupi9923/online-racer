<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Racer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(#1a1a1a,#000);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}
.container{
width:360px;
background:#222;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,255,255,.3);
}
h1{color:#00e5ff;margin-bottom:20px;}
.car{font-size:60px;margin-bottom:15px;}
button{
width:100%;
padding:15px;
margin:10px 0;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}
#create{background:#00c853;color:white;}
#join{background:#2979ff;color:white;}
input{
width:100%;
padding:15px;
font-size:18px;
border-radius:12px;
border:none;
text-align:center;
letter-spacing:4px;
}
#roomBox{
display:none;
margin-top:20px;
background:#111;
padding:15px;
border-radius:12px;
}
#roomCode{
font-size:42px;
color:#00e5ff;
letter-spacing:6px;
margin:10px 0;
}
#status{margin-top:12px;color:#bbb;}
</style>
</head>
<body>

<div class="container">
<div class="car">🏎️</div>
<h1>Online Racer</h1>

<button id="create" onclick="createRoom()">Create Room</button>

<input id="joinInput" maxlength="4" placeholder="ROOM CODE">

<button id="join" onclick="joinRoom()">Join Room</button>

<div id="roomBox">
<div>Your Room Code</div>
<div id="roomCode">----</div>
<div id="status">Waiting for Player 2...</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getDatabase,
ref,
set,
get,
update,
onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

// Your Firebase configuration
const firebaseConfig = {
apiKey: "AIzaSyCupFk6Pl7lcIMfkEG5mgj-pPSXd7fHGJ0",
authDomain: "online-racer-a0464.firebaseapp.com",
databaseURL: "https://online-racer-a0464-default-rtdb.firebaseio.com",
projectId: "online-racer-a0464",
storageBucket: "online-racer-a0464.firebasestorage.app",
messagingSenderId: "2178448228",
appId: "1:2178448228:web:8e526e5292a576cc669871",
measurementId: "G-1JDWRWYNBJ"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let room="";

// Create Room
window.createRoom=async function(){

room=Math.floor(1000+Math.random()*9000).toString();

await set(ref(db,"rooms/"+room),{
host:true,
guest:false,
started:false
});

document.getElementById("roomCode").textContent=room;
document.getElementById("roomBox").style.display="block";

watchRoom(room);
}

// Join Room
window.joinRoom=async function(){

const code=document.getElementById("joinInput").value.trim();

if(code.length!==4){
alert("Enter a 4-digit room code.");
return;
}

const snap=await get(ref(db,"rooms/"+code));

if(!snap.exists()){
alert("Room not found.");
return;
}

await update(ref(db,"rooms/"+code),{
guest:true
});

room=code;

document.getElementById("roomCode").textContent=room;
document.getElementById("roomBox").style.display="block";
document.getElementById("status").textContent="Connected!";

watchRoom(room);
}

// Watch Room
function watchRoom(code){

onValue(ref(db,"rooms/"+code),snap=>{

const data=snap.val();

if(!data)return;

if(data.guest){
document.getElementById("status").textContent="🎉 Player 2 Connected!";
}else{
document.getElementById("status").textContent="Waiting for Player 2...";
}
});
}
</script>

</body>
</html>
