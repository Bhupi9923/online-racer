<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Online Racer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.container{
width:390px;
background:#1e1e1e;
padding:18px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,255,255,.35);
text-align:center;
}
h1{color:#00e5ff;margin-bottom:15px}
button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}
#create{background:#00c853;color:white}
#join{background:#2979ff;color:white}
input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
text-align:center;
letter-spacing:4px;
margin:6px 0;
}
#roomBox{
display:none;
margin-top:10px;
padding:12px;
background:#111;
border-radius:12px;
}
#roomCode{
font-size:34px;
color:#00e5ff;
letter-spacing:4px;
margin:8px 0;
}
#status{color:#bbb}
canvas{
display:none;
margin-top:15px;
width:100%;
border-radius:12px;
background:#555;
}
#controls{
display:none;
margin-top:12px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}
.ctrl{
background:#333;
font-size:24px;
padding:14px;
border-radius:10px;
user-select:none;
}
#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:40px;
z-index:100;
}
#overlay button{
width:220px;
margin-top:20px;
font-size:20px;
}
</style>
</head>
<body>

<div class="container">

<h1>🏎️ Online Racer</h1>

<button id="create" onclick="createRoom()">Create Room</button>

<input id="joinInput" maxlength="4" placeholder="ROOM CODE">

<button id="join" onclick="joinRoom()">Join Room</button>

<div id="roomBox">
<div>Your Room</div>
<div id="roomCode">----</div>
<div id="status">Waiting for Player 2...</div>
</div>

<canvas id="game" width="360" height="600"></canvas>

<div id="controls">
<div></div>
<div class="ctrl" ontouchstart="press('ArrowUp')" ontouchend="release('ArrowUp')">⬆️</div>
<div></div>

<div class="ctrl" ontouchstart="press('ArrowLeft')" ontouchend="release('ArrowLeft')">⬅️</div>
<div class="ctrl" ontouchstart="press('Shift')" ontouchend="release('Shift')">⚡</div>
<div class="ctrl" ontouchstart="press('ArrowRight')" ontouchend="release('ArrowRight')">➡️</div>
</div>

</div>

<div id="overlay">
<div id="overlayText">🏆 YOU WIN!</div>
<button onclick="location.reload()">Play Again</button>
</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,set,get,update,onValue,push}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCupFk6Pl7lcIMfkEG5mgj-pPSXd7fHGJ0",
authDomain:"online-racer-a0464.firebaseapp.com",
databaseURL:"https://online-racer-a0464-default-rtdb.firebaseio.com",
projectId:"online-racer-a0464",
storageBucket:"online-racer-a0464.firebasestorage.app",
messagingSenderId:"2178448228",
appId:"1:2178448228:web:8e526e5292a576cc669871"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");
const overlay=document.getElementById("overlay");
const overlayText=document.getElementById("overlayText");

let room="",player="",players={};
let keys={};

let roadOffset=0;
let nitro=100;
let speed=4;
let racing=false;
let paused=false;
let night=false;
const finishY=40;

let traffic=[];

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
let osc,gain;

function startEngine(){
if(osc)return;
osc=audioCtx.createOscillator();
gain=audioCtx.createGain();
osc.type="sawtooth";
osc.frequency.value=120;
gain.gain.value=.03;
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
}

function stopEngine(){
if(!osc)return;
osc.stop();
osc=null;
}

const redCar=new Image();
redCar.src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="60"><rect x="6" y="0" width="24" height="60" rx="8" fill="%23d32f2f"/><rect x="9" y="12" width="18" height="16" rx="4" fill="%2387ceeb"/><circle cx="6" cy="12" r="4"/><circle cx="30" cy="12" r="4"/><circle cx="6" cy="48" r="4"/><circle cx="30" cy="48" r="4"/></svg>';

const blueCar=new Image();
blueCar.src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="60"><rect x="6" y="0" width="24" height="60" rx="8" fill="%231976d2"/><rect x="9" y="12" width="18" height="16" rx="4" fill="%2387ceeb"/><circle cx="6" cy="12" r="4"/><circle cx="30" cy="12" r="4"/><circle cx="6" cy="48" r="4"/><circle cx="30" cy="48" r="4"/></svg>';

window.press=k=>keys[k]=true;
window.release=k=>keys[k]=false;

document.addEventListener("keydown",e=>{
keys[e.key]=true;
audioCtx.resume();
if(e.key==="p"||e.key==="P")paused=!paused;
if(e.key==="n"||e.key==="N")night=!night;
if(e.key.startsWith("Arrow"))startEngine();
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
if(!keys.ArrowLeft&&!keys.ArrowRight&&!keys.ArrowUp)stopEngine();
});

window.createRoom=async()=>{

room=Math.floor(1000+Math.random()*9000).toString();
player="host";

await set(ref(db,"rooms/"+room),{
players:{
host:{x:120,y:520,color:"red"}
}
});

document.getElementById("roomCode").textContent=room;
document.getElementById("roomBox").style.display="block";

watchRoom();

};

window.joinRoom=async()=>{

const code=document.getElementById("joinInput").value.trim();

if(code.length!==4)return alert("Enter a 4-digit room.");

const snap=await get(ref(db,"rooms/"+code));

if(!snap.exists())return alert("Room not found.");

room=code;
player="guest";

await update(ref(db,"rooms/"+room+"/players"),{
guest:{x:240,y:520,color:"blue"}
});

document.getElementById("roomCode").textContent=room;
document.getElementById("roomBox").style.display="block";

watchRoom();

};

function watchRoom(){

onValue(ref(db,"rooms/"+room+"/players"),snap=>{

players=snap.val()||{};

if(players.host&&players.guest){

canvas.style.display="block";
document.getElementById("controls").style.display="grid";

if(!racing)startCountdown();

}

});

}

let count=3;

function startCountdown(){

status.textContent="3";

const t=setInterval(()=>{

count--;

if(count>0)status.textContent=count;
else if(count===0){
status.textContent="GO!";
racing=true;
}
else{
clearInterval(t);
status.textContent="Race!";
}

},1000);

}

function spawnTraffic(){

traffic.push({
x:[80,180,280][Math.floor(Math.random()*3)],
y:-80
});

}

setInterval(spawnTraffic,1200);

async function updatePlayer(){

if(!racing||!players[player])return;

const p={...players[player]};

if(keys.Shift&&nitro>0){
speed=8;
nitro-=.6;
}
else{
speed=4;
nitro=Math.min(100,nitro+.12);
}

if(keys.ArrowLeft)p.x-=speed;
if(keys.ArrowRight)p.x+=speed;
if(keys.ArrowUp)p.y-=speed;

p.x=Math.max(50,Math.min(310,p.x));
p.y=Math.max(30,Math.min(560,p.y));

traffic.forEach(c=>{

if(Math.abs(c.x-p.x)<28&&Math.abs(c.y-p.y)<42){

p.x=180;
p.y=520;

}

});

await update(ref(db,"rooms/"+room+"/players/"+player),p);

if(p.y<=finishY+15){

await push(ref(db,"leaderboard"),{
winner:player,
time:Date.now()
});

overlay.style.display="flex";
overlayText.textContent=(player==="host"?"🔴 RED":"🔵 BLUE")+" WINS!";

}

}

function drawRoad(){

roadOffset=(roadOffset+6)%40;

ctx.fillStyle=night?"#111":"#444";
ctx.fillRect(0,0,360,600);

ctx.fillStyle="white";
ctx.fillRect(30,0,5,600);
ctx.fillRect(325,0,5,600);

ctx.fillStyle="yellow";

for(let y=-40;y<640;y+=40)
ctx.fillRect(177,y+roadOffset,6,20);

ctx.fillStyle="white";

for(let x=30;x<330;x+=20){

ctx.fillRect(x,finishY,10,10);
ctx.fillRect(x+10,finishY+10,10,10);

}

}

function drawCars(){

Object.values(players).forEach(p=>{

ctx.drawImage(
p.color==="red"?redCar:blueCar,
p.x-18,p.y-30,36,60
);

});

}

function drawTraffic(){

traffic.forEach(c=>{

c.y+=5;

ctx.fillStyle="#ff9800";
ctx.fillRect(c.x-15,c.y-25,30,50);

});

traffic=traffic.filter(c=>c.y<650);

}

function drawNitro(){

ctx.fillStyle="#222";
ctx.fillRect(20,570,100,10);

ctx.fillStyle="#00e5ff";
ctx.fillRect(20,570,nitro,10);

ctx.strokeStyle="white";
ctx.strokeRect(20,570,100,10);

}

function gameLoop(){

if(paused){

ctx.fillStyle="rgba(0,0,0,.7)";
ctx.fillRect(0,0,360,600);

ctx.fillStyle="white";
ctx.font="30px Arial";
ctx.fillText("PAUSED",110,300);

requestAnimationFrame(gameLoop);
return;

}

drawRoad();
drawTraffic();
drawCars();
drawNitro();

updatePlayer();

requestAnimationFrame(gameLoop);

}

onValue(ref(db,"leaderboard"),snap=>{

const d=snap.val();

if(!d)return;

const latest=Object.values(d).pop();

status.textContent="Last Winner: "+latest.winner;

});

gameLoop();

</script>

</body>
</html>
